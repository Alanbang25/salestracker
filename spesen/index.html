<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--bg4:#222230;
  --border:#2a2a3a;--border2:#3a3a50;
  --text:#e8e8f0;--text2:#9090a8;--text3:#5a5a70;
  --accent:#e60000;--accent-hover:#ff1a1a;--accent-text:#ffffff;--green:#00e676;--red:#ff4444;--amber:#ffb300;--purple:#7c3aed;
  --yellow:#fbbf24;
}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.page{display:none;padding:16px 12px}.page.active{display:block}
.page-title{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-bottom:3px}
.page-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
select.sel{background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:11px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;cursor:pointer}
select.sel:focus{outline:none;border-color:var(--accent)}
.role-bar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.role-bar::-webkit-scrollbar{display:none}
.role-chip{flex:none;padding:5px 11px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all 0.15s;text-transform:uppercase;letter-spacing:0.06em}
.role-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(230,0,0,0.08)}
.sec-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.inp{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;width:100%}
.inp:focus{outline:none;border-color:var(--accent)}
.inp::placeholder{color:var(--text3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-bg.hidden{display:none}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:18px 14px 34px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-title{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.modal-close{background:var(--bg4);border:1px solid var(--border);color:var(--text2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
.metric-card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:13px}
.metric-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px}
.metric-val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600}
.metric-val.g{color:var(--green)}.metric-val.a{color:var(--accent)}.metric-val.y{color:var(--amber)}.metric-val.r{color:var(--red)}.metric-val.p{color:#a78bfa}
.input-group{margin-bottom:11px}
.input-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s}
.btn-primary{background:var(--accent);color:var(--accent-text)}.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:rgba(255,68,68,0.12);color:var(--red);border:1px solid rgba(255,68,68,0.25)}
.btn-ghost{background:var(--bg4);color:var(--text2);border:1px solid var(--border)}
.sep{height:1px;background:var(--border);margin:18px 0}
.no-data{text-align:center;padding:20px;color:var(--text3);font-size:13px}
.toast-wrap{position:fixed;top:58px;right:10px;z-index:9999;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.toast{background:var(--bg4);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text);animation:tslide 0.25s ease;max-width:230px}
.toast.ok{border-color:rgba(0,230,118,0.4);color:var(--green)}
.toast.err{border-color:rgba(255,68,68,0.4);color:var(--red)}
.toast.info{border-color:rgba(230,0,0,0.4);color:var(--accent)}
@keyframes tslide{from{transform:translateX(28px);opacity:0}to{transform:translateX(0);opacity:1}}
/* ── SPESEN ─────────────────────────────────────────────── */
.sp-row{display:flex;gap:8px}.sp-row>*{flex:1;min-width:0}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sp-chip{padding:5px 10px;border-radius:14px;font-size:12px;border:1px solid var(--border);background:var(--bg4);color:var(--text2);cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.sp-chip.on{border-color:var(--accent);background:rgba(230,0,0,0.14);color:var(--text)}
.sp-chip .x{margin-left:6px;color:var(--text3)}.sp-chip .x:hover{color:var(--red)}
.sp-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:7px}
.sp-card.click{cursor:pointer}.sp-card.click:hover{border-color:var(--border2)}
.sp-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sp-meta{font-size:10px;color:var(--text3);letter-spacing:0.04em}
.sp-title{font-size:13px;font-weight:500;margin:2px 0}
.sp-sub{font-size:11px;color:var(--text2)}
.sp-amt{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap}
.sp-split{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:11px}
.sp-split-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.sp-split-row:last-child{border-bottom:none}
.sp-split-row .inp{width:110px;flex:none;text-align:right;padding:6px 9px}
.sp-check{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2);margin:4px 0 10px;cursor:pointer}
.sp-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em}
.sp-tag.e{background:rgba(230,0,0,0.12);color:var(--accent)}.sp-tag.a{background:rgba(124,58,237,0.14);color:#a78bfa}.sp-tag.z{background:rgba(0,230,118,0.12);color:var(--green)}
.sp-ico{background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px 4px}.sp-ico:hover{color:var(--text)}
.sp-ledger{width:100%;border-collapse:collapse;font-size:12px}
.sp-ledger th{text-align:left;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;padding:6px 4px;border-bottom:1px solid var(--border2)}
.sp-ledger td{padding:6px 4px;border-bottom:1px solid var(--border);vertical-align:top}
.sp-ledger .n{text-align:right;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
#spPrint{display:none}
body.sp-printing>*:not(#spPrint){display:none!important}
body.sp-printing{background:#fff}
body.sp-printing #spPrint{display:block;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11px;padding:16px;min-height:100vh}
#spPrint h1{font-size:18px;margin:0 0 2px}#spPrint h2{font-size:13px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid #111}
#spPrint .pm{color:#555;font-size:10px;margin-bottom:10px}
#spPrint table{width:100%;border-collapse:collapse;margin-bottom:6px;page-break-inside:auto}
#spPrint tr{page-break-inside:avoid}
#spPrint th{background:#e5e7eb;text-align:left;padding:4px 5px;font-size:9.5px;border:1px solid #bbb}
#spPrint td{padding:4px 5px;border:1px solid #ccc;vertical-align:top}
#spPrint td.n,#spPrint th.n{text-align:right;white-space:nowrap}
#spPrint tr.t td{font-weight:700;background:#f3f4f6}
#spPrint .bar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;margin:-16px -16px 12px;padding:10px 16px;background:#111;}
#spPrint .bar button{padding:8px 14px;border-radius:6px;border:none;font-size:13px;cursor:pointer}
#spPrint .sig{margin-top:28px;display:flex;gap:40px}#spPrint .sig div{flex:1;border-top:1px solid #111;padding-top:4px;font-size:10px;color:#555}
@media print{@page{size:A4 landscape;margin:10mm}#spPrint .bar{display:none!important}body.sp-printing #spPrint{padding:0}}
@media print{@page{size:A4 landscape;margin:10mm}#spPrint .bar{display:none!important}body.sp-printing #spPrint{padding:0}}

body{padding-bottom:40px}
.app{max-width:720px;margin:0 auto}
.top{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top-title{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600}
.me-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .role-bar{margin-bottom:0;padding-bottom:10px}
.top .role-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.top .role-chip{font-size:10px;padding:8px 2px;text-align:center;letter-spacing:0.02em}
.page{display:block;padding:16px 14px}

<body>
<div class="app">
  <div class="top">
    <div class="top-row"><div class="top-title">💶 Spesen</div><button class="me-btn" id="meBtn" onclick="spSetName()">👤 Name festlegen</button></div>
    <div id="spTabs"></div>
  </div>
  <div class="page active" id="page-spesen"><div id="spesenContent"></div></div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="modal-bg hidden" id="modalBg" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle"></div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<script>
// Eigenständige Spesen-App. Daten liegen lokal im Browser (localStorage 'vf_spesen_app').
const memStore={};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return k in memStore?memStore[k]:null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}}
const curUid='app';const users=[];
function cur(){return {id:'app',name:lsGet('spesen_app_name')||'Ich'}}
function closeModal(){document.getElementById('modalBg').classList.add('hidden')}
function closeModalOutside(e){if(e.target===document.getElementById('modalBg'))closeModal()}
function spRenderMe(){const n=lsGet('spesen_app_name');document.getElementById('meBtn').textContent=n?'👤 '+n:'👤 Name festlegen'}
function spSetName(){const n=prompt('Dein Name (steht im Report als „Ausgelegt von“):',lsGet('spesen_app_name')||'');if(n!==null&&n.trim()){lsSet('spesen_app_name',n.trim());spRenderMe();refreshSpesen()}}
// Einmalig: Daten aus dem früheren Spesen-Tab der Salestracker-App übernehmen (gleiche Domain).
function spMigrate(){
  if(lsGet('vf_spesen_app'))return;
  try{let best=null,bestN=-1;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('vf_spesen_')||k==='vf_spesen_app')continue;
    let n=0;try{const d=JSON.parse(localStorage.getItem(k));n=(d.expenses||[]).length+(d.agency||[]).length+(d.payments||[]).length}catch(e){}
    if(n>bestN){best=k;bestN=n}}
    if(best&&bestN>0){lsSet('vf_spesen_app',localStorage.getItem(best));setTimeout(()=>toast('Daten aus Salestracker übernommen','ok'),400)}}catch(e){}
}
function _xmlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// CRC32 (für ZIP/XLSX ohne Kompression, Methode "store").
function _crc32(buf){let crc=~0;for(let i=0;i<buf.length;i++){crc^=buf[i];for(let j=0;j<8;j++)crc=(crc>>>1)^(0xEDB88320&-(crc&1));}return (~crc)>>>0;}
// Minimaler ZIP-Writer (store), Rückgabe Uint8Array.
function _zipStore(files){
  const enc=new TextEncoder();const chunks=[];const cd=[];let off=0;
  files.forEach(f=>{
    const nameB=enc.encode(f.name);const data=f.data;const crc=_crc32(data);const start=off;
    const lh=new Uint8Array(30+nameB.length);const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);
    dv.setUint16(10,0,true);dv.setUint16(12,0x21,true);dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true);dv.setUint32(22,data.length,true);
    dv.setUint16(26,nameB.length,true);dv.setUint16(28,0,true);lh.set(nameB,30);
    chunks.push(lh);chunks.push(data);off+=lh.length+data.length;
    const ch=new Uint8Array(46+nameB.length);const cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
    cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0x21,true);cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nameB.length,true);
    cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);cv.setUint32(42,start,true);ch.set(nameB,46);cd.push(ch);
  });
  const cdSize=cd.reduce((s,b)=>s+b.length,0);const cdOff=off;
  const eocd=new Uint8Array(22);const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,cdOff,true);
  const all=[...chunks,...cd,eocd];const total=all.reduce((s,b)=>s+b.length,0);
  const out=new Uint8Array(total);let p=0;all.forEach(b=>{out.set(b,p);p+=b.length;});return out;
}
// ══ SPESEN · AGENTUR-RECHNUNG · SALDEN ═════════════════════
// Je Account in localStorage 'vf_spesen_<uid>' gespeichert (wie der Rest der App nur lokal).
// Logik: Ich lege Kosten aus → Anteile der Beteiligten = Forderung (Soll).
// Zahlungen der Mitarbeiter = Haben. Saldo = offener Betrag je Person.
const SP_CATS=['Bewirtung','Reisekosten','Übernachtung','Fahrtkosten','Teamevent','Sonstiges'];
let sp=null,spUid=null,spTab='erfassen',spMode='ausgabe',spEdit=null,spF=null,spA=null,spFrom=null,spTo=null,spHistType='alle',spHistQ='';

function spEsc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function r2(n){return Math.round((n||0)*100)/100}
function spNum(v){if(typeof v==='number')return r2(v);let s=String(v||'').trim().replace(/[\s€]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?r2(n):0}
function spEur(n){return (n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function spIn(n){return n?String(r2(n).toFixed(2)).replace('.',','):''}
function spPad(n){return String(n).padStart(2,'0')}
function spIso(y,m,d){const t=new Date(y,m,d);return t.getFullYear()+'-'+spPad(t.getMonth()+1)+'-'+spPad(t.getDate())}
function spToday(){const n=new Date();return spIso(n.getFullYear(),n.getMonth(),n.getDate())}
function spKW(ds){if(!ds)return '';const [y,m,dd]=ds.split('-').map(Number);const d=new Date(Date.UTC(y,m-1,dd));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return String(Math.ceil((((d-ys)/86400000)+1)/7))}
function spDE(ds){if(!ds)return '';const [y,m,d]=ds.split('-');return d+'.'+m+'.'+y}
function spId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function spCmp(a,b){return a.date.localeCompare(b.date)||((a.created||0)-(b.created||0))}

// ── Daten ──
function spData(){
  if(sp&&spUid===curUid) return sp;
  let d=null;try{d=JSON.parse(lsGet('vf_spesen_'+curUid)||'null')}catch(e){d=null}
  if(!d||typeof d!=='object') d={};
  d.expenses=d.expenses||[];d.agency=d.agency||[];d.payments=d.payments||[];d.seq=d.seq||{};
  const p=d.presets=d.presets||{};['persons','orte','anlaesse','zwecke'].forEach(k=>p[k]=p[k]||[]);
  if(!d.seeded){const me=cur();users.forEach(u=>{if(me&&u.id!==me.id&&u.name&&!p.persons.includes(u.name))p.persons.push(u.name)});d.seeded=true}
  sp=d;spUid=curUid;spEdit=null;spF=null;spA=null;return sp;
}
function spSave(){lsSet('vf_spesen_'+spUid,JSON.stringify(sp))}
function spNextNr(t){const d=spData();d.seq[t]=(d.seq[t]||0)+1;return t+'-'+String(d.seq[t]).padStart(4,'0')}
function spLearn(k,v){v=(v||'').trim();if(!v)return;const a=spData().presets[k];if(!a.some(x=>x.toLowerCase()===v.toLowerCase())){a.push(v);a.sort((x,y)=>x.localeCompare(y,'de'))}}
function spNewF(){const t=spF&&spF.date||spToday();return {date:t,kw:spKW(t),ort:'',anlass:'',cat:'Bewirtung',total:'',note:'',sel:[],shares:{},manual:{},meIn:true}}
function spNewA(){const t=spA&&spA.date||spToday();return {date:t,kw:spKW(t),zweck:'',betrag:'',rechnr:'',note:''}}

// Buchungen (Soll = Anteil, Haben = Zahlung) je Person, chronologisch mit laufendem Saldo.
function spBookings(name){
  const d=spData();const rows=[];
  d.expenses.forEach(e=>e.shares.forEach(s=>{if(s.name===name&&s.amount)rows.push({date:e.date,nr:e.nr,text:(e.anlass||'Ausgabe')+(e.ort?' · '+e.ort:''),soll:s.amount,haben:0,created:e.created})}));
  d.payments.forEach(p=>{if(p.name===name)rows.push({id:p.id,date:p.date,nr:p.nr,text:'Zahlung'+(p.note?' · '+p.note:''),soll:0,haben:p.amount,created:p.created})});
  rows.sort(spCmp);let bal=0;rows.forEach(r=>{bal=r2(bal+r.soll-r.haben);r.saldo=bal});return rows;
}
function spBalances(toDate){
  const d=spData();const m={};const add=(n,k,v)=>{(m[n]=m[n]||{name:n,soll:0,haben:0})[k]+=v};
  d.expenses.forEach(e=>{if(toDate&&e.date>toDate)return;e.shares.forEach(s=>add(s.name,'soll',s.amount))});
  d.payments.forEach(p=>{if(toDate&&p.date>toDate)return;add(p.name,'haben',p.amount)});
  return Object.values(m).map(x=>({name:x.name,soll:r2(x.soll),haben:r2(x.haben),offen:r2(x.soll-x.haben)}))
    .sort((a,b)=>b.offen-a.offen||a.name.localeCompare(b.name,'de'));
}

// ── Zeitraum ──
function spPeriodInit(){if(!spFrom){const y=new Date().getFullYear();spFrom=y+'-01-01';spTo=y+'-12-31'}}
function spQuick(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(k==='monat'){spFrom=spIso(y,m,1);spTo=spIso(y,m+1,0)}
  else if(k==='vormonat'){spFrom=spIso(y,m-1,1);spTo=spIso(y,m,0)}
  else if(k==='quartal'){const q=Math.floor(m/3)*3;spFrom=spIso(y,q,1);spTo=spIso(y,q+3,0)}
  else if(k==='jahr'){spFrom=y+'-01-01';spTo=y+'-12-31'}
  else if(k==='vorjahr'){spFrom=(y-1)+'-01-01';spTo=(y-1)+'-12-31'}
  else {spFrom='2000-01-01';spTo='2099-12-31'}
  refreshSpesen();
}
function spPeriodLabel(){return spFrom==='2000-01-01'&&spTo==='2099-12-31'?'Gesamter Zeitraum':spDE(spFrom)+' – '+spDE(spTo)}
function spPeriodHtml(){spPeriodInit();
  const q=[['monat','Monat'],['vormonat','Vormonat'],['quartal','Quartal'],['jahr','Jahr'],['vorjahr','Vorjahr'],['alles','Alles']];
  return `<div class="sp-row" style="margin-bottom:6px"><div><div class="input-label">Von</div><input class="inp" type="date" value="${spFrom}" onchange="spFrom=this.value||spFrom;refreshSpesen()"></div>
    <div><div class="input-label">Bis</div><input class="inp" type="date" value="${spTo}" onchange="spTo=this.value||spTo;refreshSpesen()"></div></div>
    <div class="sp-chips" style="margin-bottom:12px">${q.map(([k,l])=>`<button class="sp-chip" onclick="spQuick('${k}')">${l}</button>`).join('')}</div>`;
}

// ── Haupt-Render ──
function refreshSpesen(){
  const pg=document.getElementById('page-spesen');const el=document.getElementById('spesenContent');
  if(!el||!pg.classList.contains('active'))return;
  spData();if(!spF)spF=spNewF();if(!spA)spA=spNewA();
  const tabs=[['erfassen',spEdit?'✏️ Bearb.':'➕ Neu'],['historie','🗂 Historie'],['salden','💰 Salden'],['export','📤 Export']];
  const body={erfassen:spRenderForm,historie:spRenderHist,salden:spRenderSalden,export:spRenderExport}[spTab]();
  el.innerHTML=`<div class="role-bar">${tabs.map(([k,l])=>`<button class="role-chip${spTab===k?' active':''}" onclick="spTab='${k}';refreshSpesen()">${l}</button>`).join('')}</div>`+body;
}

// ── Erfassen ──
function spChipList(kind,cur,setFn){
  const a=spData().presets[kind];if(!a.length)return '';

function spRenderForm(){

    <button class="btn ${spMode==='ausgabe'?'btn-primary':'btn-ghost'}" style="justify-content:center" onclick="spMode='ausgabe';refreshSpesen()" ${spEdit&&spEdit.type!=='E'?'disabled':''}>🧾 Ausgabe</button>
    <button class="btn ${spMode==='agentur'?'btn-primary':'btn-ghost'}" style="justify-content:center" onclick="spMode='agentur';refreshSpesen()" ${spEdit&&spEdit.type!=='A'?'disabled':''}>🏢 Agentur-Rechnung</button></div>`;
  const editInfo=spEdit?`<div class="sp-card" style="border-color:var(--amber);font-size:12px">✏️ Du bearbeitest <b>${spEsc(spEdit.nr)}</b> <button class="btn btn-ghost" style="float:right;padding:3px 9px" onclick="spCancelEdit()">Abbrechen</button></div>`:'';
  return editInfo+mode+(spMode==='agentur'?spFormAgentur():spFormAusgabe());
}
function spFormAusgabe(){
  const f=spF,p=spData().presets,me=cur();
  const persons=[...p.persons];f.sel.forEach(n=>{if(!persons.includes(n))persons.push(n)});
  spCalcShares();
  const own=r2(spNum(f.total)-f.sel.reduce((s,n)=>s+spNum(f.shares[n]),0));
  return `
  <div class="sp-row"><div class="input-group"><div class="input-label">Datum</div><input class="inp" type="date" value="${f.date}" onchange="spF.date=this.value;spF.kw=spKW(this.value);document.getElementById('spKw').value=spF.kw"></div>
    <div class="input-group" style="flex:0 0 90px"><div class="input-label">KW</div><input class="inp" id="spKw" inputmode="numeric" value="${spEsc(f.kw)}" oninput="spF.kw=this.value"></div></div>
  <div class="input-group"><div class="input-label">Ort</div><input class="inp" id="spOrt" list="spDlOrte" placeholder="z.B. Restaurant Adler, Köln" value="${spEsc(f.ort)}" oninput="spF.ort=this.value">${spChipList('orte',f.ort,'spPickOrt')}</div>
  <div class="input-group"><div class="input-label">Anlass</div><input class="inp" id="spAnlass" list="spDlAnlaesse" placeholder="z.B. Team-Meeting, Kundentermin" value="${spEsc(f.anlass)}" oninput="spF.anlass=this.value">${spChipList('anlaesse',f.anlass,'spPickAnlass')}</div>
  <div class="input-group"><div class="input-label">Kategorie</div><select class="sel" style="width:100%;padding:9px 12px;font-size:13px" onchange="spF.cat=this.value">${SP_CATS.map(c=>`<option${c===f.cat?' selected':''}>${c}</option>`).join('')}</select></div>
  <div class="input-group"><div class="input-label">Beteiligte Personen</div>
    <div class="sp-chips">${persons.map(n=>`<button class="sp-chip${f.sel.includes(n)?' on':''}" onclick="spTogglePerson(${spEsc(JSON.stringify(n))})">${f.sel.includes(n)?'✓ ':''}${spEsc(n)}</button>`).join('')||'<span style="font-size:11px;color:var(--text3)">Noch keine Personen gespeichert – unten hinzufügen.</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="spNewPerson" placeholder="Neue Person" style="flex:1" onkeydown="if(event.key==='Enter')spAddPerson()"><button class="btn btn-ghost" onclick="spAddPerson()">+ Person</button></div>
    <label class="sp-check"><input type="checkbox" ${f.meIn?'checked':''} onchange="spF.meIn=this.checked;refreshSpesen()"> Ich (${spEsc(me.name)}) bin selbst beteiligt – mein Anteil wird nicht geschuldet</label></div>
  <div class="input-group"><div class="input-label">Gesamtkosten (€)</div><input class="inp" inputmode="decimal" placeholder="0,00" value="${spEsc(f.total)}" oninput="spF.total=this.value;spUpdateSplitUI()" style="font-family:'IBM Plex Mono';font-size:16px"></div>
  ${f.sel.length?`<div class="sp-split"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="input-label" style="margin:0">Aufteilung · was jeder schuldet</span><button class="sp-chip" onclick="spF.manual={};refreshSpesen()">⚖️ Gleich verteilen</button></div>
    ${f.sel.map((n,i)=>`<div class="sp-split-row"><span style="flex:1">${spEsc(n)}</span><input class="inp" id="spSh${i}" inputmode="decimal" value="${spIn(spNum(f.shares[n]))}" oninput="spShareInput(${i},this.value)"></div>`).join('')}
    <div class="sp-split-row" style="color:var(--text3)"><span style="flex:1">${f.meIn?'Mein Anteil':'Nicht umgelegt'}</span><span class="sp-amt" id="spOwn" style="width:110px;text-align:right;color:${own<0?'var(--red)':'var(--text2)'}">${spEur(own)}</span></div></div>`:''}
  <div class="input-group"><div class="input-label">Beleg-Nr. / Notiz (optional)</div><input class="inp" placeholder="z.B. Rechnung 4711, Kartenzahlung" value="${spEsc(f.note)}" oninput="spF.note=this.value"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" onclick="spSaveExpense()">${spEdit?'💾 Änderung speichern':'💾 Ausgabe speichern'}</button>
  <datalist id="spDlOrte">${p.orte.map(v=>`<option value="${spEsc(v)}">`).join('')}</datalist>
  <datalist id="spDlAnlaesse">${p.anlaesse.map(v=>`<option value="${spEsc(v)}">`).join('')}</datalist>`;
}
function spPickOrt(i){spF.ort=spData().presets.orte[i];refreshSpesen()}
function spPickAnlass(i){spF.anlass=spData().presets.anlaesse[i];refreshSpesen()}
function spPickZweck(i){spA.zweck=spData().presets.zwecke[i];refreshSpesen()}
function spTogglePerson(n){const s=spF.sel;const i=s.indexOf(n);if(i>=0){s.splice(i,1);delete spF.shares[n];delete spF.manual[n]}else s.push(n);refreshSpesen()}
function spAddPerson(){const el=document.getElementById('spNewPerson');const v=(el.value||'').trim();if(!v)return;
  spLearn('persons',v);const n=spData().presets.persons.find(x=>x.toLowerCase()===v.toLowerCase());if(!spF.sel.includes(n))spF.sel.push(n);spSave();refreshSpesen()}
function spCalcShares(){const f=spF;const total=spNum(f.total);
  const man=f.sel.filter(n=>f.manual[n]);const manSum=man.reduce((s,n)=>s+spNum(f.shares[n]),0);
  const auto=f.sel.filter(n=>!f.manual[n]);const k=auto.length+(f.meIn?1:0);
  const each=k?Math.max(0,Math.floor((total-manSum)/k*100)/100):0;
  // Ohne eigene Beteiligung bekommt die letzte Person den Rundungsrest.
  auto.forEach((n,i)=>{f.shares[n]=(!f.meIn&&i===auto.length-1)?Math.max(0,r2(total-manSum-each*(auto.length-1))):each});
}
function spUpdateSplitUI(){spCalcShares();const f=spF;
  f.sel.forEach((n,i)=>{const el=document.getElementById('spSh'+i);if(el&&!f.manual[n]&&document.activeElement!==el)el.value=spIn(spNum(f.shares[n]))});
  const o=document.getElementById('spOwn');if(o){const own=r2(spNum(f.total)-f.sel.reduce((s,n)=>s+spNum(f.shares[n]),0));o.textContent=spEur(own);o.style.color=own<0?'var(--red)':'var(--text2)'}}
function spShareInput(i,v){const n=spF.sel[i];spF.shares[n]=v;spF.manual[n]=true;spUpdateSplitUI()}
function spSaveExpense(){
  const f=spF,d=spData(),me=cur();spCalcShares();const total=spNum(f.total);
  if(!f.date)return toast('Datum fehlt','err');
  if(!f.ort.trim())return toast('Ort fehlt','err');
  if(!f.anlass.trim())return toast('Anlass fehlt','err');
  if(total<=0)return toast('Betrag fehlt','err');
  if(!f.sel.length&&!f.meIn)return toast('Mindestens eine beteiligte Person','err');
  const shares=f.sel.map(n=>({name:n,amount:spNum(f.shares[n])}));
  const sum=r2(shares.reduce((s,x)=>s+x.amount,0));
  if(sum>total+0.001)return toast('Aufteilung ist höher als die Gesamtkosten','err');
  const rec={date:f.date,kw:String(f.kw||spKW(f.date)),ort:f.ort.trim(),anlass:f.anlass.trim(),cat:f.cat,total,shares,own:r2(total-sum),meIn:f.meIn,
    payer:me.name,teilnehmer:[...(f.meIn?[me.name]:[]),...f.sel],note:(f.note||'').trim()};
  if(spEdit&&spEdit.type==='E'){const i=d.expenses.findIndex(x=>x.id===spEdit.id);if(i>=0)d.expenses[i]={...d.expenses[i],...rec,updated:Date.now()}}
  else d.expenses.push({id:spId(),nr:spNextNr('S'),created:Date.now(),...rec});
  spLearn('orte',rec.ort);spLearn('anlaesse',rec.anlass);f.sel.forEach(n=>spLearn('persons',n));
  d.expenses.sort(spCmp);spSave();toast(spEdit?'Änderung gespeichert':'Ausgabe gespeichert','ok');
  spEdit=null;spF=spNewF();refreshSpesen();
}
function spFormAgentur(){

  return `<div class="sp-row"><div class="input-group"><div class="input-label">Datum</div><input class="inp" type="date" value="${a.date}" onchange="spA.date=this.value;spA.kw=spKW(this.value);document.getElementById('spKwA').value=spA.kw"></div>
    <div class="input-group" style="flex:0 0 90px"><div class="input-label">KW</div><input class="inp" id="spKwA" inputmode="numeric" value="${spEsc(a.kw)}" oninput="spA.kw=this.value"></div></div>

    <div class="input-group"><div class="input-label">Rechnungs-Nr. (optional)</div><input class="inp" value="${spEsc(a.rechnr)}" oninput="spA.rechnr=this.value"></div></div>

  <datalist id="spDlZwecke">${p.zwecke.map(v=>`<option value="${spEsc(v)}">`).join('')}</datalist>`;

function spSaveAgentur(){
  const a=spA,d=spData();const betrag=spNum(a.betrag);

  else d.agency.push({id:spId(),nr:spNextNr('A'),created:Date.now(),...rec});
  spLearn('zwecke',rec.zweck);d.agency.sort(spCmp);spSave();toast(spEdit?'Änderung gespeichert':'Agentur-Position gespeichert','ok');
  spEdit=null;spA=spNewA();refreshSpesen();
}
function spCancelEdit(){spEdit=null;spF=spNewF();spA=spNewA();refreshSpesen()}
function spEditEntry(type,id){const d=spData();
  if(type==='E'){const e=d.expenses.find(x=>x.id===id);if(!e)return;const shares={},manual={};e.shares.forEach(s=>{shares[s.name]=s.amount;manual[s.name]=true});
    spF={date:e.date,kw:e.kw,ort:e.ort,anlass:e.anlass,cat:e.cat,total:spIn(e.total),note:e.note||'',sel:e.shares.map(s=>s.name),shares,manual,meIn:e.meIn!==false};spMode='ausgabe';spEdit={type,id,nr:e.nr}}
  else if(type==='A'){const a=d.agency.find(x=>x.id===id);if(!a)return;spA={date:a.date,kw:a.kw,zweck:a.zweck,betrag:spIn(a.betrag),rechnr:a.rechnr||'',note:a.note||''};spMode='agentur';spEdit={type,id,nr:a.nr}}

}
function spDelete(type,id){const d=spData();const key={E:'expenses',A:'agency',Z:'payments'}[type];const x=d[key].find(r=>r.id===id);if(!x)return;
  if(!confirm(`${x.nr} wirklich löschen? Das ändert auch die Salden.`))return;
  d[key]=d[key].filter(r=>r.id!==id);spSave();toast('Gelöscht','ok');
  if(type==='Z'&&!document.getElementById('modalBg').classList.contains('hidden'))spOpenPerson(x.name);
  refreshSpesen();
}

// ── Historie ──
function spRenderHist(){
  const d=spData();const inP=x=>x.date>=spFrom&&x.date<=spTo;spPeriodInit();
  let items=[...d.expenses.filter(inP).map(x=>({...x,_t:'E'})),...d.agency.filter(inP).map(x=>({...x,_t:'A'})),...d.payments.filter(inP).map(x=>({...x,_t:'Z'}))];
  const sum=(t,f)=>r2(items.filter(x=>x._t===t).reduce((s,x)=>s+f(x),0));
  const sE=sum('E',x=>x.total),sA=sum('A',x=>x.betrag),sZ=sum('Z',x=>x.amount);
  if(spHistType!=='alle')items=items.filter(x=>x._t===spHistType);
  const q=spHistQ.toLowerCase();
  if(q)items=items.filter(x=>[x.nr,x.ort,x.anlass,x.zweck,x.name,x.note,x.cat,...(x.teilnehmer||[])].join(' ').toLowerCase().includes(q));
  items.sort((a,b)=>-spCmp(a,b));
  const types=[['alle','Alle'],['E','Ausgaben'],['A','Agentur'],['Z','Zahlungen']];
  const card=x=>{
    if(x._t==='E')return `<div class="sp-card"><div class="sp-head"><div style="min-width:0"><div class="sp-meta"><span class="sp-tag e">Ausgabe</span> ${x.nr} · ${spDE(x.date)} · KW ${spEsc(x.kw)} · ${spEsc(x.cat)}</div>
      <div class="sp-title">${spEsc(x.anlass)} · ${spEsc(x.ort)}</div><div class="sp-sub">👥 ${spEsc((x.teilnehmer||[]).join(', '))}</div>
      ${x.shares.length?`<div class="sp-sub" style="color:var(--text3)">${x.shares.map(s=>spEsc(s.name)+': '+spEur(s.amount)).join(' · ')}</div>`:''}${x.note?`<div class="sp-sub" style="color:var(--text3)">📝 ${spEsc(x.note)}</div>`:''}</div>
      <div style="text-align:right"><div class="sp-amt">${spEur(x.total)}</div><div><button class="sp-ico" title="Bearbeiten" onclick="spEditEntry('E','${x.id}')">✏️</button><button class="sp-ico" title="Löschen" onclick="spDelete('E','${x.id}')">🗑</button></div></div></div></div>`;
    if(x._t==='A')return `<div class="sp-card"><div class="sp-head"><div style="min-width:0"><div class="sp-meta"><span class="sp-tag a">Agentur</span> ${x.nr} · ${spDE(x.date)} · KW ${spEsc(x.kw)}${x.rechnr?' · RE '+spEsc(x.rechnr):''}</div>
      <div class="sp-title">${spEsc(x.zweck)}</div>${x.note?`<div class="sp-sub" style="color:var(--text3)">📝 ${spEsc(x.note)}</div>`:''}</div>
      <div style="text-align:right"><div class="sp-amt" style="color:#a78bfa">${spEur(x.betrag)}</div><div><button class="sp-ico" onclick="spEditEntry('A','${x.id}')">✏️</button><button class="sp-ico" onclick="spDelete('A','${x.id}')">🗑</button></div></div></div></div>`;
    return `<div class="sp-card"><div class="sp-head"><div><div class="sp-meta"><span class="sp-tag z">Zahlung</span> ${x.nr} · ${spDE(x.date)}</div><div class="sp-title">${spEsc(x.name)} hat gezahlt</div>${x.note?`<div class="sp-sub" style="color:var(--text3)">📝 ${spEsc(x.note)}</div>`:''}</div>
      <div style="text-align:right"><div class="sp-amt" style="color:var(--green)">${spEur(x.amount)}</div><button class="sp-ico" onclick="spDelete('Z','${x.id}')">🗑</button></div></div></div>`;
  };
  return spPeriodHtml()+`<div class="metric-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="metric-card"><div class="metric-label">Ausgaben</div><div class="metric-val a" style="font-size:15px">${spEur(sE)}</div></div>
    <div class="metric-card"><div class="metric-label">Agentur</div><div class="metric-val p" style="font-size:15px">${spEur(sA)}</div></div>
    <div class="metric-card"><div class="metric-label">Zahlungen</div><div class="metric-val g" style="font-size:15px">${spEur(sZ)}</div></div></div>
    <div class="sp-chips" style="margin-bottom:8px">${types.map(([k,l])=>`<button class="sp-chip${spHistType===k?' on':''}" onclick="spHistType='${k}';refreshSpesen()">${l}</button>`).join('')}</div>
    <input class="inp" placeholder="🔎 Suchen (Person, Ort, Anlass, Beleg-Nr.)" value="${spEsc(spHistQ)}" onchange="spHistQ=this.value;refreshSpesen()" style="margin-bottom:10px">
    ${items.map(card).join('')||'<div class="no-data">Keine Einträge im Zeitraum</div>'}`;
}

// ── Salden ──

    ${bal.map(b=>`<div class="sp-card click" onclick="spOpenPerson(${spEsc(JSON.stringify(b.name))})"><div class="sp-head" style="align-items:center">
      <div><div class="sp-title">${spEsc(b.name)}</div><div class="sp-meta">Belastet ${spEur(b.soll)} · Gezahlt ${spEur(b.haben)}</div></div>
      <div class="sp-amt" style="font-size:16px;color:${b.offen>0.004?'var(--red)':b.offen<-0.004?'var(--amber)':'var(--green)'}">${b.offen>0.004?spEur(b.offen):b.offen<-0.004?'Guthaben '+spEur(-b.offen):'✓ 0,00 €'}</div></div></div>`).join('')
    ||'<div class="no-data">Noch keine umgelegten Kosten</div>'}`;

function spOpenPerson(name){
  const rows=spBookings(name);const offen=rows.length?rows[rows.length-1].saldo:0;
  document.getElementById('modalTitle').textContent='Buchungen · '+name;
  document.getElementById('modalBody').innerHTML=`
    <div class="metric-card hl" style="margin-bottom:12px"><div class="metric-label">Aktueller Saldo</div><div class="metric-val ${offen>0.004?'a':'g'}">${spEur(offen)}</div></div>
    <div style="overflow-x:auto"><table class="sp-ledger"><tr><th>Datum</th><th>Beleg</th><th>Text</th><th class="n">Belastung</th><th class="n">Zahlung</th><th class="n">Saldo</th><th></th></tr>
    ${rows.map(r=>`<tr><td>${spDE(r.date)}</td><td style="color:var(--text3);white-space:nowrap">${r.nr}</td><td>${spEsc(r.text)}</td><td class="n">${r.soll?spEur(r.soll):''}</td><td class="n" style="color:var(--green)">${r.haben?spEur(r.haben):''}</td><td class="n">${spEur(r.saldo)}</td><td>${r.id?`<button class="sp-ico" onclick="spDelete('Z','${r.id}')">🗑</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="no-data">Keine Buchungen</td></tr>'}</table></div>

      <div class="input-group"><div class="input-label">Betrag (€)</div><input class="inp" id="spPayAmt" inputmode="decimal" value="${offen>0?spIn(offen):''}"></div></div>
    <div class="input-group"><div class="input-label">Notiz (optional)</div><input class="inp" id="spPayNote" placeholder="z.B. bar, PayPal, Überweisung"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="spAddPayment(${spEsc(JSON.stringify(name))})">✓ Zahlung buchen</button>`;
  document.getElementById('modalBg').classList.remove('hidden');
}
function spAddPayment(name){
  const date=document.getElementById('spPayDate').value,amount=spNum(document.getElementById('spPayAmt').value),note=document.getElementById('spPayNote').value.trim();
  if(!date)return toast('Datum fehlt','err');if(amount<=0)return toast('Betrag fehlt','err');
  const d=spData();d.payments.push({id:spId(),nr:spNextNr('Z'),date,kw:spKW(date),name,amount,note,created:Date.now()});d.payments.sort(spCmp);spSave();
  toast('Zahlung gebucht','ok');spOpenPerson(name);refreshSpesen();
}

function spAddPreset(k){const el=document.getElementById('spPre_'+k);spLearn(k,el.value);spSave();refreshSpesen()}
function spDelPreset(k,i){spData().presets[k].splice(i,1);spSave();refreshSpesen()}
function spDownload(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function spBackup(){spDownload(new Blob([JSON.stringify(spData(),null,1)],{type:'application/json'}),'spesen-backup-'+spToday()+'.json');toast('Backup erstellt','ok')}
function spRestore(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.expenses))throw 0;
    if(!confirm(`Backup mit ${d.expenses.length} Ausgaben laden? Aktuelle Spesen-Daten werden ersetzt.`))return;
    lsSet('vf_spesen_'+curUid,JSON.stringify(d));sp=null;spData();toast('Backup geladen','ok');refreshSpesen()}catch(e){toast('Ungültige Backup-Datei','err')}};
  r.readAsText(f);inp.value='';}

function spReport(){
  spPeriodInit();const d=spData();const inP=x=>x.date>=spFrom&&x.date<=spTo;
  const ex=d.expenses.filter(inP).sort(spCmp),ag=d.agency.filter(inP).sort(spCmp),pay=d.payments.filter(inP).sort(spCmp);
  const sum=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));
  const tot={ex:sum(ex,x=>x.total),own:sum(ex,x=>x.own),umg:sum(ex,x=>x.total-x.own),ag:sum(ag,x=>x.betrag),pay:sum(pay,x=>x.amount)};
  const cats={};ex.forEach(e=>cats[e.cat]=r2((cats[e.cat]||0)+e.total));
  const bal=spBalances(spTo);tot.offen=r2(bal.reduce((s,b)=>s+b.offen,0));
  const split=[];ex.forEach(e=>e.shares.forEach(s=>split.push({nr:e.nr,date:e.date,kw:e.kw,name:s.name,anlass:e.anlass,amount:s.amount})));
  // Buchungsübersicht je Person im Zeitraum, mit Vortrag
  const ledger=[];bal.map(b=>b.name).sort((a,b)=>a.localeCompare(b,'de')).forEach(n=>{
    const all=spBookings(n);const before=all.filter(r=>r.date<spFrom);const vortrag=before.length?before[before.length-1].saldo:0;
    const rows=all.filter(inP);if(!rows.length&&!vortrag)return;ledger.push({name:n,vortrag,rows,end:rows.length?rows[rows.length-1].saldo:vortrag})});
  return {ex,ag,pay,tot,cats,bal,split,ledger,label:spPeriodLabel(),me:cur().name,created:new Date().toLocaleString('de-DE')};
}

// Excel (.xlsx) ohne externe Library — nutzt _zipStore/_xmlEsc von oben.
const SP_XLSX_STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
 +'<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/><numFmt numFmtId="165" formatCode="dd\\.mm\\.yyyy"/></numFmts>'

 +'<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>'
 +'<xf numFmtId="165" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>'

 +'<xf numFmtId="1" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>'

 +'<xf numFmtId="164" fontId="3" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>'
 +'</cellXfs><cellStyles count="1"><cellStyle name="Standard" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
// cols: [{h:'Kopf',w:12,t:'s'|'d'|'e'|'i'}]; rows: Array von Arrays; total: Zeile (oder null); Zellen können {v,t,s} sein.
function spSheetXml(sh){
  const L=i=>String.fromCharCode(65+i);const S={s:4,d:5,e:6,i:7};
  const cell=(ref,v,t,s)=>{
    if(v===null||v===undefined||v==='')return `<c r="${ref}" s="${s}"/>`;
    if(t==='d'){const [y,m,dd]=String(v).split('-').map(Number);return `<c r="${ref}" s="${s}"><v>${(Date.UTC(y,m-1,dd)-Date.UTC(1899,11,30))/86400000}</v></c>`}
    if(typeof v==='number'||((t==='e'||t==='i')&&isFinite(Number(v))))return `<c r="${ref}" s="${s}"><v>${Number(v)}</v></c>`;
    return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${_xmlEsc(v)}</t></is></c>`;
  };
  let x=`<row r="1">${cell('A1',sh.title,'s',1)}</row><row r="2">${cell('A2',sh.sub,'s',2)}</row>`;
  x+=`<row r="4">${sh.cols.map((c,i)=>cell(L(i)+'4',c.h,'s',3)).join('')}</row>`;
  let r=5;
  sh.rows.forEach(row=>{x+=`<row r="${r}">${row.map((v,i)=>{const o=(v&&typeof v==='object')?v:{v};const t=o.t||sh.cols[i].t;return cell(L(i)+r,o.v,t,o.s!=null?o.s:S[t])}).join('')}</row>`;r++});
  const lastData=r-1;
  if(sh.total){x+=`<row r="${r}">${sh.total.map((v,i)=>cell(L(i)+r,v,typeof v==='number'?'e':'s',typeof v==='number'?9:8)).join('')}</row>`;r++}
  const lastCol=L(sh.cols.length-1);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'
    +`<dimension ref="A1:${lastCol}${Math.max(r-1,4)}"/>`
    +'<sheetViews><sheetView workbookViewId="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A5" sqref="A5"/></sheetView></sheetViews>'
    +'<sheetFormatPr defaultRowHeight="13"/>'
    +'<cols>'+sh.cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')+'</cols>'
    +'<sheetData>'+x+'</sheetData>'
    +(sh.filter!==false&&sh.rows.length?`<autoFilter ref="A4:${lastCol}${lastData}"/>`:'')
    +'<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>'
    +'<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>'
    +'<headerFooter><oddFooter>&amp;L&amp;A&amp;RSeite &amp;P / &amp;N</oddFooter></headerFooter></worksheet>';
}
function spBuildXlsx(sheets){
  const enc=new TextEncoder();const n=sheets.length;
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    +sheets.map((s,i)=>`<sheet name="${_xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets>'
    +(dn=>dn?'<definedNames>'+dn+'</definedNames>':'')(sheets.map((s,i)=>s.filter!==false&&s.rows.length?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${_xmlEsc(s.name)}'!$A$4:$${String.fromCharCode(64+s.cols.length)}$${4+s.rows.length}</definedName>`:'').join(''))+'</workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
    +`<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
  const files=[{name:'[Content_Types].xml',data:enc.encode(ct)},{name:'_rels/.rels',data:enc.encode(rels)},{name:'xl/workbook.xml',data:enc.encode(wb)},{name:'xl/_rels/workbook.xml.rels',data:enc.encode(wbRels)},{name:'xl/styles.xml',data:enc.encode(SP_XLSX_STYLES)},
    ...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:enc.encode(spSheetXml(s))}))];
  return new Blob([_zipStore(files)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

      ['Anzahl Ausgaben (Belege)',{v:R.ex.length,t:'i'}],['Summe Ausgaben gesamt',R.tot.ex],['davon auf Mitarbeiter umgelegt',R.tot.umg],['davon Eigenanteil / nicht umgelegt',R.tot.own],

      rows:R.ex.map(e=>[e.nr,e.date,Number(e.kw)||e.kw,e.ort,e.anlass,e.cat,(e.teilnehmer||[]).join(', '),e.total,e.own,r2(e.total-e.own),e.note||'']),

  <h2>Übersicht</h2>${tbl([['Position'],['Betrag','n']],[['Anzahl Ausgaben (Belege)',R.ex.length],['Summe Ausgaben gesamt',E(R.tot.ex)],['davon auf Mitarbeiter umgelegt',E(R.tot.umg)],['davon Eigenanteil / nicht umgelegt',E(R.tot.own)],['Summe Agentur-Rechnung',E(R.tot.ag)],['Zahlungseingänge Mitarbeiter',E(R.tot.pay)],['Offene Forderungen (Stichtag)',E(R.tot.offen)],...Object.entries(R.cats).map(([c,v])=>['Kategorie: '+e(c),E(v)])])}
  <h2>Ausgaben / Bewirtungen</h2>${tbl([['Beleg'],['Datum'],['KW'],['Ort'],['Anlass'],['Kat.'],['Teilnehmer'],['Gesamt','n'],['Eigen','n'],['Umgelegt','n'],['Beleg/Notiz']],
    R.ex.map(x=>[x.nr,spDE(x.date),e(x.kw),e(x.ort),e(x.anlass),e(x.cat),e((x.teilnehmer||[]).join(', ')),E(x.total),E(x.own),E(r2(x.total-x.own)),e(x.note||'')]),['Summe','','','','','','',E(R.tot.ex),E(R.tot.own),E(R.tot.umg),''])}
  <h2>Kostenaufteilung je Person</h2>${tbl([['Beleg'],['Datum'],['KW'],['Person'],['Anlass'],['Betrag','n']],R.split.map(s=>[s.nr,spDE(s.date),e(s.kw),e(s.name),e(s.anlass),E(s.amount)]),['Summe','','','','',E(R.tot.umg)])}
  <h2>Agentur-Rechnung</h2>${tbl([['Nr.'],['Datum'],['KW'],['Zweck'],['Rechnungs-Nr.'],['Betrag','n'],['Notiz']],R.ag.map(a=>[a.nr,spDE(a.date),e(a.kw),e(a.zweck),e(a.rechnr||''),E(a.betrag),e(a.note||'')]),['Summe','','','','',E(R.tot.ag),''])}
  <h2>Salden je Mitarbeiter</h2>${tbl([['Person'],['Belastet','n'],['Gezahlt','n'],['Offen','n']],R.bal.map(b=>[e(b.name),E(b.soll),E(b.haben),E(b.offen)]),['Summe',E(r2(R.bal.reduce((s,b)=>s+b.soll,0))),E(r2(R.bal.reduce((s,b)=>s+b.haben,0))),E(R.tot.offen)])}
  <h2>Buchungsübersicht je Mitarbeiter</h2>${R.ledger.map(l=>`<div style="font-weight:700;margin:8px 0 3px">${e(l.name)}</div>`+tbl([['Datum'],['Beleg'],['Buchungstext'],['Belastung','n'],['Zahlung','n'],['Saldo','n']],
    [['','','Vortrag','','',E(l.vortrag)],...l.rows.map(r=>[spDE(r.date),r.nr,e(r.text),r.soll?E(r.soll):'',r.haben?E(r.haben):'',E(r.saldo)])],['','','Endsaldo','','',E(l.end)])).join('')||'<div>Keine Buchungen</div>'}
  <div class="sig"><div>Ort, Datum</div><div>Unterschrift</div></div>`;
  document.body.classList.add('sp-printing');window.scrollTo(0,0);
  setTimeout(()=>{try{window.print()}catch(err){}},350);
}
function spClosePrint(){document.body.classList.remove('sp-printing')}
function toast(msg,type){
  const c=document.getElementById('toasts');const t=document.createElement('div');
  t.className=`toast ${type}`;t.textContent=msg;
  c.appendChild(t);setTimeout(()=>t.remove(),2400);
}
// Tabs in die fixierte Kopfleiste verschieben
const _spRefresh=refreshSpesen;
refreshSpesen=function(){_spRefresh();const el=document.getElementById('spesenContent');const bar=el.querySelector('.role-bar');const t=document.getElementById('spTabs');t.innerHTML='';if(bar)t.appendChild(bar)};
spMigrate();spRenderMe();refreshSpesen();
if(!lsGet('spesen_app_name'))setTimeout(spSetName,600);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
